name: Scraper unit tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile scraper modules
        run: python -m py_compile sync.py upcoming_games_sync.py tests/test_media_extraction.py
      - name: Test media and playtime extraction
        run: python -m unittest discover -s tests -v
