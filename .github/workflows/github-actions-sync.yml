name: Sync Xbox Game Pass catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build full catalog
        run: python sync.py

      - name: Publish changed catalog
        run: |
          git config user.name "xbox-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xbox-essential.json
          git diff --cached --quiet || git commit -m "chore: sync Xbox Game Pass catalog"
          git push
