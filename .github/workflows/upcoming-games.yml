name: Upcoming Game Pass Games Scraper

on:
  workflow_dispatch:
  push:
    paths:
      - "upcoming_games_sync.py"
      - "sync.py"
      - "requirements.txt"
      - ".github/workflows/upcoming-games.yml"
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: upcoming-game-pass-page
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-upcoming-games:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape upcoming games and render standalone HTML
        run: python upcoming_games_sync.py
      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upcoming-game-pass-games.html upcoming-game-pass-games.json
          git diff --cached --quiet || git commit -m "Refresh upcoming Game Pass page"
          git pull --rebase origin main
          git push
