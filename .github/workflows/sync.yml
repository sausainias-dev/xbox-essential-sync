name: Xbox Game Pass Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sync Xbox Game Pass catalog
        run: python sync.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add xbox-essential.json

          if [ -f xbox-metadata-cache.json ]; then
            git add xbox-metadata-cache.json
          fi

          git diff --cached --quiet || git commit -m "Update Xbox Game Pass catalog"
          git push
