name: Xbox Game Pass Sync

on:
  workflow_dispatch:
  push:
    paths:
      - "sync.py"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    - cron: "0 */6 * * *"

# Serialize every publisher so two runners cannot rebase/push generated data
# at the same time. The dedicated upcoming workflow owns the upcoming files.
concurrency:
  group: xbox-game-pass-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sync Xbox Game Pass catalog
        run: python sync.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # xbox-essential.json is owned by this workflow.
          # upcoming-game-pass-games.json/.html are owned by upcoming-games.yml.
          git add xbox-essential.json

          if [ -f xbox-metadata-cache.json ]; then
            git add xbox-metadata-cache.json
          fi

          git diff --cached --quiet || git commit -m "Update Xbox Game Pass catalog"
          git pull --rebase origin main
          git push
