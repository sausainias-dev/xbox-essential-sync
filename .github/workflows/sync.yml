name: Xbox Game Pass Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sync.py"
      - "requirements.txt"
      - ".github/workflows/sync.yml"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: xbox-game-pass-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test media and playtime extraction
        run: python -m unittest discover -s tests -v
      - name: Sync Xbox Game Pass catalog
        run: python sync.py
      - name: Commit and publish catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xbox-essential.json
          if [ -f xbox-metadata-cache.json ]; then git add xbox-metadata-cache.json; fi
          if git diff --cached --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git commit -m "Update Xbox Game Pass catalog"
          git push origin HEAD:main
